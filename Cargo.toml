[package]
name = "md_viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JoergKau/Enhanced-Markdown-File-Viewer-Linux"
description = "Native Markdown editor and viewer for Ubuntu Linux (x86_64)"

[dependencies]
# On Linux the windowing backend features ("x11", "wayland") must be enabled
# explicitly, because the package uses `default-features = false` and winit
# fails to compile without at least one backend.
eframe = { version = "0.37", features = ["clipboard", "default_fonts", "links", "system_fonts", "wgpu", "x11", "wayland"], default-features = false }
egui_extras = { version = "0.37", features = ["file", "image", "svg_text"] }
env_logger = "0.11.11"
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
latex-rust = { version = "3.0.1", default-features = false, features = ["std", "png"] }
log = "0.4.34"
mermaid-svg = "0.7"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
ammonia = "4"
rfd = "0.16"
tl = "0.7.8"
encoding_rs = "0.8.35"
unicode-bidi = "0.3.18"
toml = "0.8.23"
serde_json = "1.0.145"

[profile.release]
# Desktop GUI app: size over marginal speed.
lto = "thin"
strip = true
codegen-units = 1
